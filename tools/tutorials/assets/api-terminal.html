<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Song API - terminal</title>
<style>
  /* Tutorial 10's stage (song-api.mjs): a terminal that shows the requests the tutorial really sends to the running
     ComfyUI's Song API and the answers it really gets, a card for the finished song (its cover and its sound) and a
     code view. Everything is put in as text. */
  :root { --bg: #0b0a12; --panel: #13111d; --line: rgba(255, 255, 255, 0.08); --text: #e9e6f5; --muted: #8f8aa6;
          --accent: #a78bfa; --ok: #6ee7a8; --key: #93c5fd; --str: #fcd34d; --num: #f9a8d4; --mono: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 30% 0%, #2a1a4a 0%, var(--bg) 60%); color: var(--text);
               font: 15px/1.5 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  .wrap { position: absolute; inset: 34px 44px; display: grid; grid-template-columns: minmax(0, 1fr) 0; gap: 0; transition: grid-template-columns 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), gap 0.6s; }
  .wrap.side { grid-template-columns: minmax(0, 1fr) 470px; gap: 28px; }
  .term { display: flex; flex-direction: column; min-height: 0; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar b { margin-left: 10px; font: 600 13px var(--mono); color: var(--muted); }
  .log { flex: 1; overflow: hidden; padding: 18px 22px 30px; font: 16px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .log .cmd { color: #fff; margin-top: 14px; }
  .log .cmd::before { content: '$ '; color: var(--ok); }
  .log .cmd .caret { display: inline-block; width: 9px; height: 1.1em; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .log .out { color: var(--muted); }
  .log .note { color: var(--accent); font-style: italic; }
  .log .ok { color: var(--ok); }
  .k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); } .p { color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  .side-pane { min-width: 0; display: flex; flex-direction: column; gap: 20px; opacity: 0; transition: opacity 0.6s; }
  .wrap.side .side-pane { opacity: 1; }
  .song { border-radius: 18px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
  .song img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .song .meta { padding: 14px 18px 18px; }
  .song .meta b { display: block; font-size: 22px; }
  .song .meta small { color: var(--muted); }
  .song .wave { display: flex; gap: 3px; align-items: center; height: 34px; margin-top: 10px; }
  .song .wave span { flex: 1; background: var(--accent); border-radius: 2px; height: 20%; transition: height 0.12s; }
  .files { border-radius: 16px; background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; font: 13px/1.7 var(--mono); color: var(--muted); }
  .files b { color: var(--text); }
  .code { position: absolute; inset: 34px 44px; border-radius: 16px; background: #0e0c16; border: 1px solid var(--line); padding: 22px 26px; overflow: hidden;
          font: 15px/1.55 var(--mono); white-space: pre; opacity: 0; transform: translateY(24px); transition: opacity 0.5s, transform 0.6s; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  .code.on { opacity: 1; transform: none; }
  .code .c { color: #6b6585; } .code .kw { color: #c4b5fd; } .code .st { color: var(--str); }
  .code h3 { margin: 0 0 12px; font: 600 14px 'Segoe UI', sans-serif; color: var(--accent); white-space: normal; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <section class="term">
    <div class="bar"><i></i><i></i><i></i><b id="title">Song API</b></div>
    <div class="log" id="log"></div>
  </section>
  <aside class="side-pane" id="side"></aside>
</div>
<div class="code" id="code"></div>
<script>
  'use strict'
  const $ = (id) => document.getElementById(id)
  const log = $('log')
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }
  function scroll() { log.scrollTop = log.scrollHeight }
  // JSON with colours, as text nodes (nothing is put in as HTML)
  function jsonNode(value, indent = 0) {
    const frag = document.createDocumentFragment()
    const pad = '  '.repeat(indent)
    const add = (text, cls) => frag.append(cls ? el('span', cls, text) : document.createTextNode(text))
    if (Array.isArray(value)) {
      if (!value.length) { add('[]', 'p'); return frag }
      add('[\n', 'p')
      value.forEach((v, i) => { add(pad + '  '); frag.append(jsonNode(v, indent + 1)); add(i < value.length - 1 ? ',\n' : '\n', 'p') })
      add(pad + ']', 'p')
    } else if (value && typeof value === 'object') {
      const keys = Object.keys(value)
      if (!keys.length) { add('{}', 'p'); return frag }
      add('{\n', 'p')
      keys.forEach((k, i) => {
        add(pad + '  '); add(JSON.stringify(k), 'k'); add(': ', 'p'); frag.append(jsonNode(value[k], indent + 1)); add(i < keys.length - 1 ? ',\n' : '\n', 'p')
      })
      add(pad + '}', 'p')
    } else if (typeof value === 'string') add(JSON.stringify(value), 's')
    else add(JSON.stringify(value), 'n')
    return frag
  }
  window.term = {
    title(text) { $('title').textContent = text },
    clear() { log.replaceChildren() },
    async cmd(text, perChar = 22) {
      const line = el('div', 'cmd')
      const caret = el('span', 'caret')
      line.append(caret)
      log.append(line)
      for (const ch of text) { caret.before(document.createTextNode(ch)); scroll(); await sleep(ch === ' ' ? perChar * 0.6 : perChar) }
      caret.remove()
      scroll()
    },
    out(value) {
      const box = el('div', 'out')
      if (typeof value === 'string') box.textContent = value
      else box.append(jsonNode(value))
      log.append(box)
      scroll()
    },
    note(text, cls = 'note') { log.append(el('div', cls, text)); scroll() },
    // the finished song beside the terminal: its cover, its title, a little level meter - and its sound, through an
    // AudioContext (the tutorial's audio tap records what reaches its destination)
    async song({ title, by, cover, audio, files }) {
      const side = $('side')
      side.replaceChildren()
      const card = el('div', 'song')
      if (cover) { const img = new Image(); img.src = cover; img.alt = ''; card.append(img) }
      const meta = el('div', 'meta')
      meta.append(el('b', '', title), el('small', '', by || ''))
      const wave = el('div', 'wave')
      for (let i = 0; i < 28; i++) wave.append(el('span'))
      meta.append(wave)
      card.append(meta)
      side.append(card)
      if (files?.length) {
        const list = el('div', 'files')
        list.append(el('b', '', 'result.files'))
        for (const f of files) list.append(el('div', '', f))
        side.append(list)
      }
      $('wrap').classList.add('side')
      if (!audio) return
      const context = new AudioContext()
      const player = new Audio(audio)
      player.crossOrigin = 'anonymous'
      const source = context.createMediaElementSource(player)
      const analyser = context.createAnalyser()
      analyser.fftSize = 64
      source.connect(analyser)
      analyser.connect(context.destination)
      const bins = new Uint8Array(analyser.frequencyBinCount)
      const bars = [...wave.children]
      const draw = () => { analyser.getByteFrequencyData(bins); bars.forEach((b, i) => (b.style.height = `${12 + (bins[i % bins.length] / 255) * 88}%`)); requestAnimationFrame(draw) }
      draw()
      window.__song = { player, context }
      await player.play()
    },
    volume(v) { if (window.__song) window.__song.player.volume = v },
    // a code file over the terminal (comments and strings coloured), or none
    code(name, text) {
      const box = $('code')
      box.replaceChildren()
      if (!text) { box.classList.remove('on'); return }
      box.append(el('h3', '', name))
      for (const line of text.split('\n')) {
        const row = el('div')
        const hash = line.indexOf('#')
        const comment = hash >= 0 && !/["'][^"']*#/.test(line.slice(0, hash + 1)) ? line.slice(hash) : ''
        const body = comment ? line.slice(0, hash) : line
        for (const part of body.split(/("(?:[^"\\]|\\.)*")/)) {
          if (/^".*"$/.test(part)) row.append(el('span', 'st', part))
          else row.append(document.createTextNode(part.replace(/\b(def|import|from|while|for|in|if|else|return|with|as|not|print)\b/g, '$1')))
        }
        if (comment) row.append(el('span', 'c', comment))
        if (!line) row.append(document.createTextNode(' '))
        box.append(row)
      }
      box.classList.add('on')
    },
  }
</script>
</body>
</html>
